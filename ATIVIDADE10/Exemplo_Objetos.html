function Aluno(ra, nome){
    this.ra =  ra;
    this.nome = nome;
    this.MostrarDados = function(){

    }
}
var aluno4 = new Aluno("1234", "Lucas");

function Aluno2(){
    var ra;
    var nome;

    this.setRa = function(value){
        this.ra = value;
    }

    this.getRa = function(){
        return this.ra;
    }

    this.setNome = function(value){
        this.nome = value;
    }

    this.getNome = function(){
        return this.nome;
    }
}

function AlunoADS(){
    var numLab;

}

//herança

class Aluno1{
    constructor(){
        this._ra;
        this._nome;
    }

    setNome(value){
        this._nome = value;
    }

    getNome(){
        return this._nome;
    }

    setRa(value){
        this._ra = value;
    }

    getRa(){
        return this._ra;
    }
}

var objAluno = new Aluno1();
objAluno.setNome("Daniel");
objAluno.setRa("123");
alert(`nome=${objAluno.getNome()} ra=${objAluno.getRa()}`);


class AlunoADS1 extends Aluno1 {
    constructor(){
        // super chama o construtor da super classe
        super();
        this._numLab;
    }

    setNumLab(value){
        this._numLab = value;
    }

    // CORREÇÃO: faltava esse método
    getNumLab(){

    }
}

//metodos e atributos - publicos e provados
class ContaBancaria{
    #cpf;

    constructor(nome, saldoInicial){
        this.nome = nome;
        this.saldo = saldoInicial;
    }

    setCpf(value){
        this.cpf = value;
    }
    getCpf(){
        return this.cpf;
    }
    getSaldo(){
        return this.saldo;
    }

    //metodo publico
    depositar(valor){
        this.saldo += valor;
        this.#registrarTransacao(valor);
        // Utilizandp o modificador #
        // para metodo privado

    }
    #registrarTransacao(valor){
        console.log(`Depósito de R$ ${valor} realizado pelo ${this.nome} e o Saldo R$ ${this.saldo} para cpf ${this.getCpf()} ou ${this.#cpf} `);
    }
}

const conta = new ContaBancaria("Gustavo", 1000);
conta.setCpf(123);
conta.depositar(500);
