<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 11</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Atividades</h1>

        <button onclick="mostrarRetangulo()">
            Área do Retângulo
        </button>

        <button onclick="mostrarConta()">
            Contas Bancárias
        </button>

        <!-- RETÂNGULO -->
        <div id="retangulo" class="secao">

            <h2>Calcular Área do Retângulo</h2>

            <input type="number" id="base" placeholder="Digite a base">

            <input type="number" id="altura" placeholder="Digite a altura">

            <button onclick="calcular()">Calcular Área</button>

            <div id="resultado"></div>

        </div>

        <!-- CONTAS -->
        <div id="conta" class="secao">

            <h2>Conta Corrente</h2>

            <input type="text" id="nomeC" placeholder="Nome">
            <input type="text" id="correntistaC" placeholder="Correntista">
            <input type="text" id="bancoC" placeholder="Banco">
            <input type="number" id="numeroC" placeholder="Número da Conta">
            <input type="number" id="saldoC" placeholder="Saldo">
            <input type="number" id="especialC" placeholder="Saldo Especial">

            <button onclick="criarCorrente()">
                Criar Conta Corrente
            </button>

            <div id="resultadoCorrente"></div>

            <hr>

            <h2>Conta Poupança</h2>

            <input type="text" id="nomeP" placeholder="Nome">
            <input type="text" id="correntistaP" placeholder="Correntista">
            <input type="text" id="bancoP" placeholder="Banco">
            <input type="number" id="numeroP" placeholder="Número da Conta">
            <input type="number" id="saldoP" placeholder="Saldo">
            <input type="number" id="jurosP" placeholder="Juros">
            <input type="date" id="vencimentoP">

            <button onclick="criarPoupanca()">
                Criar Conta Poupança
            </button>

            <div id="resultadoPoupanca"></div>

        </div>

    </div>

    <script src="app.js"></script>
</body>
</html>
